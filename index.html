<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Задачи</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #222; }
  form { display: flex; gap: 8px; margin-bottom: 24px; }
  input[type=text] { flex: 1; padding: 8px 10px; font: inherit; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 6px 12px; font: inherit; border: 1px solid #ccc; border-radius: 6px; background: #f7f7f7; cursor: pointer; }
  button:hover { background: #eee; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; overflow-wrap: anywhere; }
  .done span { text-decoration: line-through; color: #999; }
  .empty { color: #999; }
</style>
</head>
<body>
<h1>Задачи</h1>
<form id="form">
  <input id="title" type="text" required maxlength="200" placeholder="Новая задача" autocomplete="off">
  <button>Добавить</button>
</form>
<ul id="list"></ul>
<script>
async function api(path = "", method = "GET", body) {
  const response = await fetch("/api/tasks" + path, {
    method,
    headers: {"Content-Type": "application/json"},
    body: body && JSON.stringify(body),
  });
  if (!response.ok) throw new Error("Ошибка сервера: " + response.status);
  return response.status === 204 ? null : response.json();
}

function element(tag, text = "", className = "") {
  const node = document.createElement(tag);
  node.textContent = text;
  node.className = className;
  return node;
}

function button(text, onclick) {
  const node = element("button", text);
  node.onclick = onclick;
  return node;
}

async function render() {
  const tasks = await api();
  const items = tasks.map(task => {
    const item = element("li", "", task.done ? "done" : "");
    const box = element("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.onchange = () => api("/" + task.id, "PUT", {title: task.title, done: box.checked}).then(render);
    const edit = button("Изменить", async () => {
      const title = prompt("Название", task.title)?.trim();
      if (title) await api("/" + task.id, "PUT", {title, done: task.done});
      await render();
    });
    const remove = button("Удалить", () => api("/" + task.id, "DELETE").then(render));
    item.append(box, element("span", task.title), edit, remove);
    return item;
  });
  if (!items.length) items.push(element("li", "Задач пока нет", "empty"));
  document.getElementById("list").replaceChildren(...items);
}

document.getElementById("form").onsubmit = async event => {
  event.preventDefault();
  const input = document.getElementById("title");
  const title = input.value.trim();
  if (!title) return;
  await api("", "POST", {title});
  input.value = "";
  await render();
};

window.onunhandledrejection = event => alert(event.reason.message);
render();
</script>
</body>
</html>
