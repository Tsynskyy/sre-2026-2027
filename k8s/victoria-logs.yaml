apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - port: 9428
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
spec:
  serviceName: victoria-logs
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=7d
          ports:
            - containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: storage
              mountPath: /storage
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
