apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: monitoring
data:
  receiver.py: |
    import html
    import json
    from datetime import datetime, timedelta, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    MSK = timezone(timedelta(hours=3))
    rows = []


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
            now = datetime.now(MSK).strftime("%H:%M:%S")
            for a in body["alerts"]:
                line = f"{now} МСК {a['status'].upper()} {a['labels']['alertname']} [{a['labels'].get('severity')}] {a['annotations'].get('summary', '')}"
                print(line, flush=True)
                rows.insert(0, line)
            self.send_response(200)
            self.end_headers()

        def do_GET(self):
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.end_headers()
            self.wfile.write(("<meta charset='utf-8'><pre>" + html.escape("\n".join(rows)) + "</pre>").encode())


    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.12-slim
          command: ["python", "/app/receiver.py"]
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
spec:
  selector:
    app: alert-receiver
  ports:
    - port: 8080
